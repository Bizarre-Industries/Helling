name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go-env
        with:
          go-version: "1.26"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.0
        with:
          bun-version: "1.2.18"

      - name: Install lint and tools
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.0
          go install github.com/gzuidhof/tygo@v0.2.21
          go install mvdan.cc/gofumpt@v0.9.2
          go install golang.org/x/tools/cmd/goimports@v0.39.0
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Install sqlc
        env:
          SQLC_VERSION: "1.31.0"
          SQLC_SHA256: "e35394ba3df5e62669e76627f45172d18c6cbb1479e4762c51b29b0eafc16dc0"
        run: |
          curl -fsSL -o /tmp/sqlc.tar.gz \
            "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz"
          echo "${SQLC_SHA256}  /tmp/sqlc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sqlc.tar.gz -C "$HOME/go/bin" sqlc
          sqlc version

      - name: Install web deps
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Format check
        run: make fmt-check

      - name: Generate (and check drift)
        run: make check-generated

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go-env
        with:
          go-version: "1.26"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          (cd apps/hellingd && govulncheck ./...)
          (cd apps/helling-cli && govulncheck ./...)

# Taskfile.yaml
#
# Helling local task runner. Mirrors CI exactly.
# Install Task: https://taskfile.dev/installation/
#
# Primary commands:
#   task check        — run every quality gate
#   task fmt          — auto-format everything fixable
#   task gen          — validate openapi.yaml + regenerate downstream codegen
#   task test         — run Go + frontend tests
#   task install      — install all tools
#   task hooks        — install lefthook git hooks

version: "3"
silent: true
output: "interleaved"

vars:
  REPO: "{{.TASKFILE_DIR}}"
  GO_PKG: ./...
  COVERAGE_OUT: coverage.out
  OPENAPI_FILE: api/openapi.yaml
  VACUUM_RULESET: api/.vacuum.yaml
  MIN_VACUUM_SCORE: 100

env:
  GOFLAGS: -mod=readonly

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ============================================================
  # Top-level entry points
  # ============================================================

  check:
    desc: Run every quality gate (same as CI). Do this before every push.
    deps:
      - check:openapi
      - check:markdown
      - check:yaml
      - check:shell
      - check:go
      - check:frontend
      - check:sql
      - check:secrets
      - check:spelling
      - check:links
      - check:parity
      - check:iso
      - check:agents
    cmds:
      - echo ""
      - echo "✓ All quality gates passed. Safe to push."

  fmt:
    desc: Auto-format everything fixable.
    deps:
      - fmt:go
      - fmt:markdown
      - fmt:shell
      - fmt:frontend
    cmds:
      - echo "✓ Formatting done. Review diffs before committing."

  test:
    desc: Run all tests (no lint gates).
    deps:
      - test:go
      - test:frontend

  gen:
    desc: Validate openapi.yaml and regenerate downstream codegen.
    cmds:
      - task: gen:openapi
      - task: gen:go:cli
      - task: gen:frontend
      - task: gen:events
      - task: gen:sqlc

  install:
    desc: Install every tool `task check` needs.
    cmds:
      - bash scripts/install-tools.sh

  hooks:
    desc: Install lefthook git hooks.
    cmds:
      - lefthook install
      - echo "✓ Git hooks installed. Pre-commit runs on every commit; pre-push runs task check."

  clean:
    desc: Remove build artifacts, coverage, caches.
    cmds:
      - rm -rf bin/ dist/ {{.COVERAGE_OUT}} .task/
      - find . -name '*.test' -not -path './.git/*' -delete 2>/dev/null || true
      - find . -name '*.prof' -not -path './.git/*' -delete 2>/dev/null || true

  # ============================================================
  # OpenAPI generation + lint
  # ============================================================

  gen:openapi:
    desc: Validate the committed OpenAPI contract.
    cmds:
      - |
        if [ ! -f {{.OPENAPI_FILE}} ]; then
          echo "{{.OPENAPI_FILE}} is missing"
          exit 1
        fi
        echo "✓ {{.OPENAPI_FILE}} is the current source of truth"
    sources:
      - "{{.OPENAPI_FILE}}"

  check:openapi:
    desc: Lint api/openapi.yaml with vacuum (must score 100/100 against our ruleset).
    cmds:
      - vacuum lint --ruleset {{.VACUUM_RULESET}} --fail-severity info {{.OPENAPI_FILE}}
      - |
        # vacuum report uses the default ruleset unless -r is passed.
        # We must pass -r so the score reflects our ruleset, matching `vacuum lint` above.
        score=$(vacuum report --stdout -r {{.VACUUM_RULESET}} {{.OPENAPI_FILE}} | jq -r '.statistics.overallScore // .overallScore // 0')
        echo "openapi score (against custom ruleset): ${score}/100"
        if [ "${score}" -lt {{.MIN_VACUUM_SCORE}} ]; then
          echo "FAIL: openapi score ${score}/100 below minimum {{.MIN_VACUUM_SCORE}}/100"
          exit 1
        fi
    sources:
      - "{{.OPENAPI_FILE}}"
      - "{{.VACUUM_RULESET}}"

  check:openapi:generated:
    desc: Verify generated Go server code matches the committed OpenAPI contract.
    cmds:
      - |
        if [ ! -f apps/hellingd/api/generate.go ]; then
          echo "apps/hellingd API generator not present. Skipping generated drift check."
          exit 0
        fi
        cd apps/hellingd
        go generate ./api/...
        cd ../..
        if ! git diff --quiet -- apps/hellingd/api/server.gen.go || [ -n "$(git ls-files --others --exclude-standard -- apps/hellingd/api/server.gen.go)" ]; then
          echo "FAIL: generated Go server code is out of sync. Run: cd apps/hellingd && go generate ./api/..."
          git diff --stat -- apps/hellingd/api/server.gen.go
          git ls-files --others --exclude-standard -- apps/hellingd/api/server.gen.go
          exit 1
        fi

  openapi:report:
    desc: Show vacuum category breakdown against our ruleset.
    cmds:
      - |
        vacuum report --stdout -r {{.VACUUM_RULESET}} {{.OPENAPI_FILE}} | \
          jq -r '.statistics | "Overall: \(.overallScore)/100  warnings=\(.totalWarnings)  errors=\(.totalErrors // 0)", "",
                  (.categoryStatistics[] | "  \(.categoryName | . + "                              " | .[0:30]) score=\(.score)  issues=\(.numIssues)")'

  openapi:dashboard:
    desc: Open interactive vacuum dashboard.
    cmds:
      - vacuum dashboard --ruleset {{.VACUUM_RULESET}} {{.OPENAPI_FILE}}

  # ============================================================
  # Markdown — excludes refs/
  # ============================================================

  check:markdown:
    cmds:
      - git ls-files -z '*.md' | xargs -0 markdownlint-cli2 --no-globs
      - git ls-files -z '*.md' | xargs -0 prettier --check --ignore-path .gitignore --ignore-path .prettierignore

  fmt:markdown:
    cmds:
      - git ls-files -z '*.md' | xargs -0 markdownlint-cli2 --fix --no-globs || true
      - git ls-files -z '*.md' | xargs -0 prettier --write --ignore-path .gitignore --ignore-path .prettierignore

  # ============================================================
  # YAML — excludes refs/ and api/openapi.yaml
  # ============================================================

  check:yaml:
    cmds:
      - |
        # yamllint -s means strict (warnings count as failures).
        # Pass specific directories, not ".", to avoid refs/ and node_modules/.
        yamllint -s $(find . -maxdepth 4 -type f \( -name '*.yaml' -o -name '*.yml' \) \
          -not -path './.git/*' \
          -not -path './refs/*' \
          -not -path './node_modules/*' \
          -not -path './web/node_modules/*' \
          -not -path './.task/*' \
          -not -path './.tmp/*' \
          -not -path './.claude-plans/*' \
          -not -path './dist/*')

  # ============================================================
  # Shell — excludes refs/
  # ============================================================

  check:shell:
    cmds:
      - |
        files=$(find . -type f \( -name '*.sh' -o -name '*.bash' \) \
          -not -path './.git/*' \
          -not -path './refs/*' \
          -not -path './node_modules/*' \
          -not -path './web/node_modules/*' \
          -not -path './.task/*')
        if [ -z "$files" ]; then
          echo "no shell scripts found"
          exit 0
        fi
        echo "$files" | xargs shellcheck -S style
        echo "$files" | xargs shfmt -d -i 2 -ci -bn

  fmt:shell:
    cmds:
      - |
        find . -type f \( -name '*.sh' -o -name '*.bash' \) \
          -not -path './.git/*' \
          -not -path './refs/*' \
          -not -path './node_modules/*' \
          -not -path './web/node_modules/*' \
          -not -path './.task/*' \
          -print0 | xargs -0 shfmt -w -i 2 -ci -bn

  # ============================================================
  # Go
  # ============================================================

  check:go:
    desc: Go build + vet + lint + vuln + tidy + test + coverage gate.
    deps:
      - check:go:build
      - check:go:vet
      - check:go:lint
      - check:go:vuln
      - check:go:modtidy
    cmds:
      - task: check:go:test
      - task: check:go:coverage

  check:go:build:
    cmds:
      - |
        for mod in apps/hellingd apps/helling-cli; do
          if [ -f "$mod/go.mod" ]; then
            echo "▶ go build $mod"
            (cd "$mod" && go build ./...)
          fi
        done

  check:go:vet:
    cmds:
      - |
        for mod in apps/hellingd apps/helling-cli; do
          if [ -f "$mod/go.mod" ]; then
            echo "▶ go vet $mod"
            (cd "$mod" && go vet ./...)
          fi
        done

  check:go:lint:
    cmds:
      - |
        for mod in apps/hellingd apps/helling-cli; do
          if [ -f "$mod/go.mod" ]; then
            echo "▶ golangci-lint $mod"
            (cd "$mod" && golangci-lint run --timeout 5m ./...)
          fi
        done

  check:go:vuln:
    cmds:
      - |
        for mod in apps/hellingd apps/helling-cli; do
          if [ -f "$mod/go.mod" ]; then
            echo "▶ govulncheck $mod"
            (cd "$mod" && govulncheck ./...)
          fi
        done

  check:go:modtidy:
    cmds:
      - |
        for mod in apps/hellingd apps/helling-cli; do
          if [ -f "$mod/go.mod" ]; then
            echo "▶ go mod tidy check $mod"
            (
              cd "$mod"
              tmpdir=$(mktemp -d)
              trap 'rm -rf "$tmpdir"' EXIT
              cp go.mod "$tmpdir/go.mod"
              cp go.sum "$tmpdir/go.sum" 2>/dev/null || true
              go mod tidy
              if ! diff -q go.mod "$tmpdir/go.mod" >/dev/null 2>&1 || ( [ -f go.sum ] && ! diff -q go.sum "$tmpdir/go.sum" >/dev/null 2>&1 ); then
                cp "$tmpdir/go.mod" go.mod
                cp "$tmpdir/go.sum" go.sum 2>/dev/null || rm -f go.sum
                echo "FAIL: $mod go.mod or go.sum is not tidy. Run: cd $mod && go mod tidy"
                exit 1
              fi
            )
          fi
        done

  check:go:test:
    cmds:
      - |
        rm -rf .task/coverage
        mkdir -p .task/coverage
        for mod in apps/hellingd apps/helling-cli; do
          if [ -f "$mod/go.mod" ]; then
            name=$(basename "$mod")
            echo "▶ go test $mod"
            if [ "$name" = "hellingd" ]; then
              (cd "$mod" && go test -tags devauth -race -coverprofile="../../.task/coverage/$name.out" ./...)
            else
              (cd "$mod" && go test -race -coverprofile="../../.task/coverage/$name.out" ./...)
            fi
          fi
        done

  check:go:coverage:
    cmds:
      - |
        if [ ! -d .task/coverage ]; then echo "no coverage yet; skipping gate"; exit 0; fi
        for profile in .task/coverage/*.out; do
          [ -f "$profile" ] || continue
          case "$profile" in
            *hellingd.out) HELLING_COVERAGE_OVERALL_FLOOR=20 bash scripts/check-coverage.sh "$profile" ;;
            *helling-cli.out) HELLING_COVERAGE_OVERALL_FLOOR=80 bash scripts/check-coverage.sh "$profile" ;;
            *) bash scripts/check-coverage.sh "$profile" ;;
          esac
        done

  test:go:
    cmds:
      - |
        for mod in apps/hellingd apps/helling-cli; do
          if [ -f "$mod/go.mod" ]; then
            echo "▶ go test $mod"
            if [ "$(basename "$mod")" = "hellingd" ]; then
              (cd "$mod" && go test -tags devauth -race ./...)
            else
              (cd "$mod" && go test -race ./...)
            fi
          fi
        done

  fmt:go:
    cmds:
      - |
        gofumpt -w .
        goimports -w -local github.com/Bizarre-Industries/helling .

  # ============================================================
  # Frontend
  # ============================================================

  check:frontend:
    dir: web
    cmds:
      - |
        if [ ! -f package.json ]; then echo "web/ not present; skipping"; exit 0; fi
        bun install --frozen-lockfile
        bunx tsc --noEmit
        bun run gen:api
        if ! git diff --quiet -- src/api/generated 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard -- src/api/generated)" ]; then
          echo "FAIL: frontend generated code out of sync. Run: (cd web && bun run gen:api)"
          git diff --stat -- src/api/generated
          git ls-files --others --exclude-standard -- src/api/generated
          exit 1
        fi
        bun run test
        bun run build

  check:frontend:gen:
    dir: web
    desc: Verify generated API client matches committed output.
    cmds:
      - |
        if [ ! -f package.json ]; then exit 0; fi
        bun run gen:api
        if ! git diff --quiet -- src/api/generated 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard -- src/api/generated)" ]; then
          echo "FAIL: frontend generated code out of sync. Run: (cd web && bun run gen:api)"
          git diff --stat -- src/api/generated
          git ls-files --others --exclude-standard -- src/api/generated
          exit 1
        fi

  fmt:frontend:
    dir: web
    cmds:
      - |
        if [ ! -f package.json ]; then exit 0; fi
        bunx biome format --write .

  test:frontend:
    dir: web
    cmds:
      - |
        if [ ! -f package.json ]; then exit 0; fi
        bun run test

  # ============================================================
  # SQL
  # ============================================================

  check:sql:
    cmds:
      - task: check:sql:lint
      - task: check:sql:sqlc
      - task: check:sql:goose

  check:sql:lint:
    cmds:
      - |
        mig=apps/hellingd/internal/store/migrations
        if [ ! -d "$mig" ]; then exit 0; fi
        sqlfluff lint --dialect sqlite --exclude-rules LT01,LT02,RF04 "$mig"

  check:sql:sqlc:
    cmds:
      - |
        if [ ! -f sqlc.yaml ]; then exit 0; fi
        sqlc generate
        if ! git diff --quiet -- apps/hellingd/internal/store/sqlc 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard -- apps/hellingd/internal/store/sqlc)" ]; then
          echo "FAIL: sqlc-generated code out of sync. Run: sqlc generate"
          git diff --stat -- apps/hellingd/internal/store/sqlc
          git ls-files --others --exclude-standard -- apps/hellingd/internal/store/sqlc
          exit 1
        fi

  check:sql:goose:
    desc: Apply and roll back hellingd goose migrations against a throwaway DB.
    cmds:
      - |
        mig=apps/hellingd/internal/store/migrations
        if [ ! -d "$mig" ]; then exit 0; fi
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        export GOOSE_DRIVER=sqlite3 GOOSE_DBSTRING="$tmp/test.db"
        goose -dir "$mig" up
        goose -dir "$mig" down-to 0
        goose -dir "$mig" up

  migrate:
    desc: Apply hellingd goose migrations to $HELLING_DB (default ./helling-dev.db).
    vars:
      DB: '{{.HELLING_DB | default "helling-dev.db"}}'
    cmds:
      - |
        mig=apps/hellingd/internal/store/migrations
        export GOOSE_DRIVER=sqlite3 GOOSE_DBSTRING="{{.DB}}"
        goose -dir "$mig" up

  migrate:reset:
    desc: Drop and re-apply hellingd migrations against $HELLING_DB (default ./helling-dev.db).
    vars:
      DB: '{{.HELLING_DB | default "helling-dev.db"}}'
    cmds:
      - |
        mig=apps/hellingd/internal/store/migrations
        export GOOSE_DRIVER=sqlite3 GOOSE_DBSTRING="{{.DB}}"
        goose -dir "$mig" down-to 0
        goose -dir "$mig" up

  migrate:status:
    desc: Show hellingd migration status against $HELLING_DB.
    vars:
      DB: '{{.HELLING_DB | default "helling-dev.db"}}'
    cmds:
      - |
        mig=apps/hellingd/internal/store/migrations
        export GOOSE_DRIVER=sqlite3 GOOSE_DBSTRING="{{.DB}}"
        goose -dir "$mig" status

  # ============================================================
  # Secrets, spelling, links, parity
  # ============================================================

  check:secrets:
    desc: Gitleaks — respects .gitleaks.toml allowlist (excludes refs/).
    cmds:
      - |
        if [ -f .gitleaks.toml ]; then
          gitleaks detect --no-banner --redact --exit-code 1 --config .gitleaks.toml
        else
          gitleaks detect --no-banner --redact --exit-code 1
        fi

  check:spelling:
    desc: typos — respects typos.toml exclusions.
    cmds:
      - typos

  check:links:
    cmds:
      - lychee --offline --no-progress docs/ README.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md

  check:parity:
    desc: API ↔ CLI ↔ WebUI parity check.
    cmds:
      - bash scripts/check-parity.sh

  check:iso:
    desc: Validate installer ISO profile, preseed payload hook, and first-boot script wiring.
    cmds:
      - bash scripts/check-iso-config.sh

  check:agents:
    desc: Validate Codex/Claude hooks, commands, MCP, and agent config stay coherent.
    cmds:
      - bash scripts/sync-agent-tooling.sh

  # ============================================================
  # Security (not in default check)
  # ============================================================

  security:grype:
    cmds:
      - |
        if [ ! -d dist/ ]; then
          echo "No dist/ yet; run 'task build' first"
          exit 0
        fi
        grype dir:dist/ --fail-on high

  security:codeql:
    cmds:
      - |
        if ! command -v codeql >/dev/null; then
          echo "codeql CLI not installed; CodeQL runs in CI via GitHub Actions"
          exit 0
        fi
        codeql database create .codeql-db --language=go --overwrite --source-root=.
        codeql database analyze .codeql-db \
          --format=sarif-latest \
          --output=codeql-results.sarif \
          codeql/go-queries:codeql-suites/go-security-extended.qls

  # ============================================================
  # Build
  # ============================================================

  build:
    cmds:
      - |
        if [ ! -f go.mod ]; then echo "no go.mod yet; nothing to build"; exit 0; fi
        mkdir -p bin
        for cmd in apps/hellingd apps/helling-cli apps/hellingd/cmd/helling-unit-link apps/hellingd/cmd/helling-incus-trust apps/hellingd/cmd/helling-firewall; do
          if [ -d "$cmd" ]; then
            name=$(basename "$cmd")
            if [ "$cmd" = "apps/helling-cli" ]; then name=helling; fi
            go build -trimpath -ldflags='-s -w' -o "bin/$name" "./$cmd"
          fi
        done

  build:linux:
    desc: Cross-build linux binaries for the Parallels/Lima VM (ADR-052).
    vars:
      ARCH: '{{.ARCH | default "arm64"}}'
    cmds:
      - |
        if [ ! -f go.mod ]; then echo "no go.mod yet; nothing to build"; exit 0; fi
        mkdir -p "bin/linux-{{.ARCH}}"
        for cmd in apps/hellingd apps/helling-cli apps/hellingd/cmd/helling-unit-link apps/hellingd/cmd/helling-incus-trust apps/hellingd/cmd/helling-firewall; do
          if [ -d "$cmd" ]; then
            name=$(basename "$cmd")
            if [ "$cmd" = "apps/helling-cli" ]; then name=helling; fi
            GOOS=linux GOARCH={{.ARCH}} CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' -o "bin/linux-{{.ARCH}}/$name" "./$cmd" \
              || echo "warn: pure cross-compile of $name failed (CGO needed); deploy-rsync.sh falls back to in-VM build"
          fi
        done

  # ============================================================
  # Installer ISO (ADR-021 / ADR-046)
  # ============================================================

  iso:verify:
    desc: Validate the live-build ISO source without preparing payloads.
    cmds:
      - bash scripts/build-iso.sh --verify-only

  iso:prepare:
    desc: Prepare dist/iso/live-build with Helling payload files, but do not run live-build.
    cmds:
      - bash scripts/build-iso.sh --prepare-only

  iso:build:
    desc: Build the release-gate Helling Debian installer ISO with live-build. Requires HELLING_ISO_RELEASE_GATE=1 unless HEAD is a v* tag.
    cmds:
      - bash scripts/build-iso.sh

  # ============================================================
  # VM (Parallels primary, Lima fallback) — ADR-052
  # ============================================================

  vm:parallels:packer:init:
    desc: Install/resolve the Packer Parallels plugin for the Debian dev image.
    cmds:
      - bash scripts/parallels-vm-build-dev.sh --init-only

  vm:parallels:packer:validate:
    desc: Validate the Packer Parallels Debian dev image template without building it.
    cmds:
      - bash scripts/parallels-vm-build-dev.sh --validate-only

  vm:parallels:build-image:
    desc: Build and register the Packer-managed Debian Parallels dev VM image.
    cmds:
      - bash scripts/parallels-vm-build-dev.sh

  vm:parallels:up:
    desc: Start the registered Parallels dev VM; point missing VMs at the explicit Packer build.
    cmds:
      - |
        if ! command -v prlctl >/dev/null 2>&1; then
          echo "prlctl not found. Install Parallels Desktop, or use vm:lima:* fallback."
          exit 1
        fi
        VM="${HELLING_VM_NAME:-helling-dev}"
        if ! prlctl list -a 2>/dev/null | awk '{print $NF}' | grep -qx "$VM"; then
          if [ -d "${HELLING_PACKER_OUTPUT_DIR:-dist/packer/$VM}/$VM.pvm" ]; then
            bash scripts/parallels-vm-build-dev.sh --register-only
          elif [ "${HELLING_VM_CREATE:-}" = "manual" ]; then
            bash scripts/parallels-vm-bootstrap.sh
          else
            echo "Parallels VM '$VM' is not registered."
            echo "Run: task vm:parallels:build-image"
            echo "Legacy manual install path: HELLING_VM_CREATE=manual task vm:parallels:up"
            exit 1
          fi
        fi
        state=$(prlctl list -a 2>/dev/null | awk -v n="$VM" '$NF==n {print $2}')
        [ "$state" = "running" ] || prlctl start "$VM"

  vm:parallels:down:
    desc: Stop the Parallels dev VM.
    cmds:
      - prlctl stop "${HELLING_VM_NAME:-helling-dev}"

  vm:parallels:destroy:
    desc: Delete the Parallels dev VM (prompts for confirmation).
    cmds:
      - |
        VM="${HELLING_VM_NAME:-helling-dev}"
        printf "Delete VM '%s' and all its disks? Type 'yes' to confirm: " "$VM"
        read -r confirm
        [ "$confirm" = "yes" ] || { echo "Aborted."; exit 1; }
        prlctl stop "$VM" 2>/dev/null || true
        prlctl delete "$VM"

  vm:parallels:status:
    desc: Show VM state, IP, and hellingd service status.
    cmds:
      - |
        VM="${HELLING_VM_NAME:-helling-dev}"
        prlctl list -a | awk -v n="$VM" 'NR==1 || $NF==n'
        if [ -n "${HELLING_VM_HOST:-}" ]; then
          ssh -o BatchMode=yes -o ConnectTimeout=3 -p "${HELLING_VM_SSH_PORT:-22}" "${HELLING_VM_USER:-helling}@$HELLING_VM_HOST" \
            'systemctl is-active hellingd 2>/dev/null || echo "hellingd: not running"'
        else
          echo "(set HELLING_VM_HOST to query hellingd over SSH)"
        fi

  vm:parallels:sync:
    desc: Cross-build linux binaries, rsync to VM, restart hellingd.
    deps: [build:linux]
    cmds:
      - bash scripts/parallels-vm-deploy-rsync.sh

  vm:parallels:dev:
    desc: Inner-loop deploy. Build + sync + restart. Run on every save.
    cmds:
      - task: vm:parallels:sync

  vm:parallels:smoke:
    desc: Run bounded v0.2 VM smoke checks over the Parallels VM.
    cmds:
      - |
        : "${HELLING_VM_HOST:?set HELLING_VM_HOST=<vm-ip>}"
        VM_USER="${HELLING_VM_USER:-helling}"
        VM_SSH_PORT="${HELLING_VM_SSH_PORT:-22}"
        TOKEN="${HELLING_VM_TOKEN:-}"
        TARGET="${HELLING_VM_SMOKE_TARGET:-}"
        WEBHOOK_URL="${HELLING_VM_WEBHOOK_URL:-}"
        NONADMIN_TOKEN="${HELLING_VM_NONADMIN_TOKEN:-}"
        WEB_URL="${HELLING_VM_WEB_URL:-https://127.0.0.1:8006}"
        ALLOW_SKIPS="${HELLING_VM_SMOKE_ALLOW_SKIPS:-}"
        encode_b64() {
          printf '%s' "$1" | base64 | tr -d '\n'
        }
        {
          printf 'set -u\n\n'
          printf 'token_b64=%s\n' "$(encode_b64 "$TOKEN")"
          printf 'target_b64=%s\n' "$(encode_b64 "$TARGET")"
          printf 'webhook_url_b64=%s\n' "$(encode_b64 "$WEBHOOK_URL")"
          printf 'nonadmin_token_b64=%s\n' "$(encode_b64 "$NONADMIN_TOKEN")"
          printf 'web_url_b64=%s\n' "$(encode_b64 "$WEB_URL")"
          printf 'allow_skips_b64=%s\n\n' "$(encode_b64 "$ALLOW_SKIPS")"
          cat <<'REMOTE'
        set -u

        decode_b64() {
          if [ -z "$1" ]; then
            return 0
          fi
          printf '%s' "$1" | base64 -d
        }

        token="$(decode_b64 "$token_b64")"
        target="$(decode_b64 "$target_b64")"
        webhook_url="$(decode_b64 "$webhook_url_b64")"
        nonadmin_token="$(decode_b64 "$nonadmin_token_b64")"
        web_url="$(decode_b64 "$web_url_b64")"
        allow_skips="$(decode_b64 "$allow_skips_b64")"

        if [ -z "$web_url" ]; then
          web_url="https://127.0.0.1:8006"
        fi
        socket="/run/helling/api.sock"
        passed=0
        skipped=0

        pass() {
          passed=$((passed + 1))
          printf 'PASS: %s\n' "$*"
        }
        skip() {
          skipped=$((skipped + 1))
          printf 'SKIP: %s\n' "$*"
        }
        fail() {
          printf 'FAIL: %s\n' "$*" >&2
          exit 1
        }
        skip_or_fail() {
          if [ "$allow_skips" = "1" ]; then
            skip "$*"
          else
            fail "$* (set HELLING_VM_SMOKE_ALLOW_SKIPS=1 for health-only dev smoke)"
          fi
        }
        api() {
          method="$1"
          path="$2"
          body="${3:-}"
          if [ -n "$body" ]; then
            curl -fsS --unix-socket "$socket" \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              -X "$method" --data "$body" "http://helling$path"
          else
            curl -fsS --unix-socket "$socket" \
              -H "Authorization: Bearer $token" \
              -X "$method" "http://helling$path"
          fi
        }
        json_id() {
          sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1
        }

        curl -fsS --unix-socket "$socket" http://helling/healthz >/dev/null ||
          fail "hellingd health probe non-200 on $socket"
        pass "hellingd health probe green"

        [ -x /usr/bin/helling ] ||
          fail "schedule unit CLI path /usr/bin/helling is missing or not executable"
        pass "schedule unit CLI path exists at /usr/bin/helling"

        if sudo -n test -r /etc/helling/schedule-runner.token; then
          pass "schedule runner token is provisioned and root-readable"
        else
          fail "schedule runner token is missing or unreadable at /etc/helling/schedule-runner.token"
        fi

        docs_html="$(curl -kfsS "$web_url/api-docs")" ||
          fail "dashboard API docs route did not render from $web_url/api-docs"
        if printf '%s\n' "$docs_html" | grep -qi 'helling'; then
          pass "dashboard API docs route returns the WebUI shell"
        else
          fail "dashboard API docs route did not render from $web_url/api-docs"
        fi
        app_asset="$(printf '%s\n' "$docs_html" | sed -n 's/.*src="\([^"]*assets\/index[^"]*\.js\)".*/\1/p' | head -n 1)"
        [ -n "$app_asset" ] ||
          fail "dashboard API docs route did not expose the app bundle asset"
        app_js="$(curl -kfsS "$web_url$app_asset")" ||
          fail "dashboard app bundle asset could not be fetched"
        if printf '%s\n' "$app_js" | grep -q 'api-docs'; then
          pass "dashboard app bundle contains the api-docs route"
        else
          fail "dashboard app bundle is missing the api-docs route"
        fi

        if [ -z "$token" ]; then
          skip_or_fail "authenticated v0.2 checks require HELLING_VM_TOKEN"
          printf 'v0.2 smoke summary: %d passed, %d skipped\n' "$passed" "$skipped"
          exit 0
        fi

        api GET /v1/schedules >/dev/null ||
          fail "authenticated schedules list failed"
        pass "authenticated schedules list"

        if [ -n "$target" ]; then
          schedule_body="{\"name\":\"helling-v02-smoke-backup\",\"kind\":\"backup\",\"target\":\"$target\",\"on_calendar\":\"*-*-* 03:00:00 UTC\",\"enabled\":false}"
          schedule_id="$(api POST /v1/schedules "$schedule_body" | json_id)"
          [ -n "$schedule_id" ] || fail "schedule create did not return an id"
          cleanup_schedule() {
            api DELETE "/v1/schedules/$schedule_id" >/dev/null 2>&1 || true
          }
          trap cleanup_schedule EXIT
          pass "backup schedule create wrote systemd units"
          api POST "/v1/schedules/$schedule_id/run" '{}' >/dev/null ||
            fail "backup schedule run failed for target $target"
          pass "backup schedule run submitted Incus backup operation"
          cleanup_schedule
          trap - EXIT
        else
          skip_or_fail "backup schedule run requires HELLING_VM_SMOKE_TARGET"
        fi

        firewall_body='{"direction":"input","action":"drop","protocol":"tcp","source_cidr":"203.0.113.254/32","destination_port":9,"comment":"helling-v02-smoke"}'
        firewall_id="$(api POST /v1/firewall/host "$firewall_body" | json_id)"
        [ -n "$firewall_id" ] || fail "firewall rule create did not return an id"
        cleanup_firewall() {
          api DELETE "/v1/firewall/host/$firewall_id" >/dev/null 2>&1 || true
        }
        trap cleanup_firewall EXIT
        if sudo -n nft list ruleset | grep -Fq "helling:$firewall_id"; then
          pass "host firewall block rule is visible in nft ruleset"
        else
          fail "host firewall rule helling:$firewall_id not visible in nft ruleset"
        fi
        cleanup_firewall
        trap - EXIT

        if [ -n "$webhook_url" ]; then
          secret="helling-v02-smoke-secret-$(date +%s)"
          webhook_body="{\"name\":\"helling-v02-smoke\",\"url\":\"$webhook_url\",\"secret\":\"$secret\",\"events\":[\"webhook.test\"],\"enabled\":false}"
          webhook_id="$(api POST /v1/webhooks "$webhook_body" | json_id)"
          [ -n "$webhook_id" ] || fail "webhook create did not return an id"
          cleanup_webhook() {
            api DELETE "/v1/webhooks/$webhook_id" >/dev/null 2>&1 || true
          }
          trap cleanup_webhook EXIT
          delivery="$(api POST "/v1/webhooks/$webhook_id/test" '{}')"
          printf '%s\n' "$delivery" | grep -q '"status"[[:space:]]*:[[:space:]]*"success"' ||
            fail "webhook HMAC test delivery did not succeed"
          pass "webhook test delivered with HMAC signing"
          cleanup_webhook
          trap - EXIT
        else
          skip_or_fail "webhook HMAC delivery requires HELLING_VM_WEBHOOK_URL"
        fi

        if [ -n "$nonadmin_token" ]; then
          status="$(curl -sS -o /tmp/helling-nonadmin-projects.out -w '%{http_code}' --unix-socket "$socket" \
            -H "Authorization: Bearer $nonadmin_token" \
            http://helling/api/incus/1.0/projects || true)"
          [ "$status" = "403" ] ||
            fail "non-admin Incus projects request returned HTTP $status, want 403"
          pass "non-admin token is restricted from broad Incus project listing"
        else
          skip_or_fail "non-admin mTLS restriction check requires HELLING_VM_NONADMIN_TOKEN"
        fi

        printf 'v0.2 smoke summary: %d passed, %d skipped\n' "$passed" "$skipped"
        REMOTE
        } | ssh -o BatchMode=yes -p "$VM_SSH_PORT" "$VM_USER@$HELLING_VM_HOST" bash -s

  vm:parallels:logs:
    desc: Tail hellingd journal on the VM.
    cmds:
      - |
        : "${HELLING_VM_HOST:?set HELLING_VM_HOST=<vm-ip>}"
        ssh -p "${HELLING_VM_SSH_PORT:-22}" "${HELLING_VM_USER:-helling}@$HELLING_VM_HOST" sudo journalctl -fu hellingd

  vm:parallels:release-test:
    desc: Build .deb (ADR-045), install in VM, smoke. Fails on packaging skips unless HELLING_VM_RELEASE_ALLOW_SKIPS=1.
    cmds:
      - bash scripts/parallels-vm-deploy-deb.sh
      - task: vm:parallels:smoke

  test:integration:vm:
    desc: Run integration tests against the live Parallels VM (proxy + auth E2E). Requires HELLING_VM_HOST.
    cmds:
      - |
        : "${HELLING_VM_HOST:?set HELLING_VM_HOST=<vm-ip>; run task vm:parallels:up first}"
        VM_USER="${HELLING_VM_USER:-helling}"
        TOKEN="${HELLING_VM_TOKEN:-}"
        if [ -z "$TOKEN" ]; then
          echo "Skipping live-data assertions: set HELLING_VM_TOKEN=<bearer> after task vm:parallels:dev + login"
          echo "(Health probe still runs.)"
        fi
        echo "▶ Health"
        ssh -o BatchMode=yes -p "${HELLING_VM_SSH_PORT:-22}" "$VM_USER@$HELLING_VM_HOST" \
          "curl -fsS --unix-socket /run/helling/api.sock http://helling/healthz" || {
          echo "FAIL: hellingd /healthz non-200"; exit 1
        }
        if [ -n "$TOKEN" ]; then
          echo "▶ Incus instances via proxy"
          ssh -o BatchMode=yes -p "${HELLING_VM_SSH_PORT:-22}" "$VM_USER@$HELLING_VM_HOST" \
            "curl -fsS --unix-socket /run/helling/api.sock \
              -H 'Authorization: Bearer $TOKEN' \
              http://helling/api/incus/1.0/instances | head -c 200"
          echo
          echo "▶ Podman containers via proxy"
          ssh -o BatchMode=yes -p "${HELLING_VM_SSH_PORT:-22}" "$VM_USER@$HELLING_VM_HOST" \
            "curl -fsS --unix-socket /run/helling/api.sock \
              -H 'Authorization: Bearer $TOKEN' \
              http://helling/api/podman/libpod/containers/json | head -c 200"
          echo
        fi
        echo "✓ test:integration:vm passed"

  # ============================================================
  # Release tooling — git-cliff CHANGELOG + version-ship hook
  # ============================================================

  changelog:
    desc: Regenerate CHANGELOG.md from conventional commits via git-cliff.
    cmds:
      - |
        if ! command -v git-cliff >/dev/null 2>&1; then
          echo "git-cliff not installed. Install: brew install git-cliff (macOS) | cargo install git-cliff"
          exit 1
        fi
        git-cliff --config cliff.toml --output CHANGELOG.md
        echo "✓ CHANGELOG.md regenerated"

  changelog:unreleased:
    desc: Print pending CHANGELOG entries since the last tag (no file write).
    cmds:
      - git-cliff --config cliff.toml --unreleased

  plan:next-version:
    desc: Generate a tracking plan for the next version after a tag ships (ADR-053).
    cmds:
      - bash scripts/plan-next-version.sh

  # ============================================================
  # Generation sub-tasks
  # ============================================================

  gen:go:cli:
    cmds:
      - |
        if [ -f apps/helling-cli/internal/client/oapi-codegen.yaml ]; then
          oapi-codegen --config apps/helling-cli/internal/client/oapi-codegen.yaml {{.OPENAPI_FILE}}
        else
          echo "→ skipping helling-cli generated client: apps/helling-cli/internal/client/oapi-codegen.yaml is not scaffolded"
        fi

  gen:frontend:
    dir: web
    cmds:
      - |
        if [ -f package.json ]; then
          bun run gen:api
        fi

  gen:events:
    cmds:
      - |
        if command -v tygo >/dev/null 2>&1; then
          tygo generate --config tygo.yaml
        elif [ -x "$(go env GOPATH)/bin/tygo" ]; then
          "$(go env GOPATH)/bin/tygo" generate --config tygo.yaml
        else
          echo "tygo is missing; install with: go install github.com/gzuidhof/tygo@v0.2.21"
          exit 1
        fi
        cd web
        bunx biome format --write src/api/events.gen.ts

  gen:sqlc:
    cmds:
      - |
        if [ -f sqlc.yaml ]; then
          sqlc generate
        fi

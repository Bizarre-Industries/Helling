openapi: 3.0.3
info:
  title: Helling API
  version: 0.2.0
  description: |
    Helling is a self-hosted, single-node container and VM management platform.
    This is the v0.2 Platform Core bridge: authentication, instance CRUD,
    operation polling, schedules, webhooks, host firewall, events, audit, and
    user Incus scope assignment.

    All endpoints under `/v1/` are stable within v0.2. Breaking changes ship under `/v2/`.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: Bizarre Industries
    url: https://github.com/Bizarre-Industries/helling

servers:
  - url: https://localhost/v1
    description: Local installation behind the Caddy edge service
  - url: http+unix:///run/helling/api.sock/v1
    description: Direct socket access (CLI, dev)

tags:
  - name: auth
    description: Authentication and session management
  - name: instances
    description: Container and VM lifecycle
  - name: operations
    description: Async operation tracking
  - name: users
    description: Admin user management and Incus project scope assignment
  - name: schedules
    description: systemd timer-backed Helling schedules
  - name: webhooks
    description: HMAC-signed outbound event delivery
  - name: firewall
    description: Helling-managed host firewall rules
  - name: events
    description: Recent events and SSE streaming
  - name: audit
    description: Journal-backed audit query and export
  - name: meta
    description: Server identity, health, version

security:
  - cookieAuth: []

paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - meta
      security: []
      summary: Liveness probe
      description: Returns the daemon liveness state and Incus reachability flag.
      responses:
        "200":
          description: Daemon is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /version:
    get:
      operationId: getVersion
      tags:
        - meta
      security: []
      summary: Server version and build info
      description: Returns the daemon semver, API version, git commit, and build timestamp.
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /auth/login:
    post:
      operationId: authLogin
      tags:
        - auth
      security: []
      summary: Exchange username + password for a session
      description: |
        Validates credentials and, on success, issues a session via the
        `helling_session` cookie. CLI and web clients use the JSON envelope's
        Ed25519-signed access token. Accounts with enabled TOTP receive a
        pre-session MFA challenge instead of a session.
      requestBody:
        required: true
        description: User credentials
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful. Sets `helling_session` cookie and returns an access token for API clients.
          headers:
            Set-Cookie:
              description: Session cookie set on successful login.
              schema:
                type: string
                description: Standard Set-Cookie header value.
                example: helling_session=...; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenEnvelope"
              example:
                data:
                  access_token: eyJhbGciOiJFZERTQSJ9...
                  token_type: Bearer
                  expires_in: 900
                  mfa_required: false
        "202":
          description: Password accepted, but MFA must be completed before a session is issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenEnvelope"
              example:
                data:
                  mfa_required: true
                  mfa_token: c08f4a7281b54d9abef67c210d3e49a2
        "204":
          description: Browser-compatible login successful response for cookie-only clients.
          headers:
            Set-Cookie:
              description: Session cookie set on successful login.
              schema:
                type: string
                description: Standard Set-Cookie header value.
                example: helling_session=...; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=604800
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/setup/status:
    get:
      operationId: authSetupStatus
      tags:
        - auth
      security: []
      summary: Report whether first-admin setup is required
      description: Returns whether the daemon currently has zero users and will accept one-time setup.
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
              example:
                setup_required: true
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/setup:
    post:
      operationId: authSetup
      tags:
        - auth
      security: []
      summary: Create the first admin user
      description: |
        One-time first-boot setup. This endpoint is available only while no
        users exist and requires the installer setup token from
        `/etc/helling/setup-token`.
      requestBody:
        required: true
        description: First admin credentials and installer setup token
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: First admin user created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 1
                username: admin
                is_admin: true
                created_at: "2026-05-04T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/mfa/complete:
    post:
      operationId: authMfaComplete
      tags:
        - auth
      security: []
      summary: Complete a pre-session MFA challenge
      description: |
        Validates a TOTP code or one-time recovery code against the pre-session
        challenge returned by `/auth/login`. A successful request issues the
        same session cookie and access-token envelope as password-only login.
      requestBody:
        required: true
        description: MFA challenge token and TOTP or recovery code.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFACompleteRequest"
            example:
              mfa_token: c08f4a7281b54d9abef67c210d3e49a2
              totp_code: "123456"
      responses:
        "200":
          description: MFA successful. Sets `helling_session` cookie and returns an access token for API clients.
          headers:
            Set-Cookie:
              description: Session cookie set on successful MFA completion.
              schema:
                type: string
                description: Standard Set-Cookie header value.
                example: helling_session=...; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenEnvelope"
              example:
                data:
                  access_token: eyJhbGciOiJFZERTQSJ9...
                  token_type: Bearer
                  expires_in: 900
                  mfa_required: false
        "204":
          description: MFA successful cookie-only response.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      summary: Invalidate the current session
      description: Revokes the session bound to the `helling_session` cookie and clears it client-side.
      responses:
        "204":
          description: Session invalidated. Clears `helling_session` cookie.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - auth
      summary: Identity of the authenticated user
      description: Returns the profile of the user bound to the current session cookie.
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /instances:
    get:
      operationId: listInstances
      tags:
        - instances
      summary: List instances visible to the user
      description: Returns the instances visible to the authenticated user, optionally filtered by status.
      parameters:
        - in: query
          name: status
          description: Optional status filter
          schema:
            type: string
            description: Lifecycle state to filter by.
            enum: [running, stopped, frozen, error]
            example: running
      responses:
        "200":
          description: List of instances
          content:
            application/json:
              schema:
                type: array
                description: Array of instance records.
                items:
                  $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createInstance
      tags:
        - instances
      summary: Create a new instance (async)
      description: Submits an instance create request. Returns the tracking operation; poll `/operations/{id}` for completion.
      requestBody:
        required: true
        description: Instance create parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceCreate"
      responses:
        "202":
          description: Operation accepted; poll `/operations/{id}` for completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /instances/{name}:
    parameters:
      - $ref: "#/components/parameters/InstanceName"
    get:
      operationId: getInstance
      tags:
        - instances
      summary: Fetch a single instance
      description: Returns the current snapshot of one instance.
      responses:
        "200":
          description: Instance details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteInstance
      tags:
        - instances
      summary: Delete an instance (async)
      description: Submits an instance delete request. Returns the tracking operation; poll `/operations/{id}` for completion.
      responses:
        "202":
          description: Deletion operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /instances/{name}/start:
    parameters:
      - $ref: "#/components/parameters/InstanceName"
    post:
      operationId: startInstance
      tags:
        - instances
      summary: Start an instance (async)
      description: Submits a start request for the named instance. Returns the tracking operation.
      responses:
        "202":
          description: Start operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /instances/{name}/stop:
    parameters:
      - $ref: "#/components/parameters/InstanceName"
    post:
      operationId: stopInstance
      tags:
        - instances
      summary: Stop an instance (async)
      description: Submits a stop request for the named instance. Optional body controls force + timeout. Returns the tracking operation.
      requestBody:
        required: false
        description: Optional stop options (force flag, timeout seconds)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceStopRequest"
      responses:
        "202":
          description: Stop operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /operations:
    get:
      operationId: listOperations
      tags:
        - operations
      summary: List operations for the current user
      description: Returns the recent operations submitted by the authenticated user, optionally filtered by status.
      parameters:
        - in: query
          name: status
          description: Optional status filter for operations.
          schema:
            type: string
            description: Operation status to filter by.
            enum: [pending, running, success, failure, cancelled]
            example: running
        - in: query
          name: limit
          description: Maximum number of results to return.
          schema:
            type: integer
            description: Maximum result count.
            minimum: 1
            maximum: 200
            default: 50
            example: 50
      responses:
        "200":
          description: Recent operations
          content:
            application/json:
              schema:
                type: array
                description: Array of operation records.
                items:
                  $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /operations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Operation identifier (UUID).
        schema:
          type: string
          description: UUID v7 string.
          format: uuid
          example: 018f3a40-0000-7000-8000-000000000000
    get:
      operationId: getOperation
      tags:
        - operations
      summary: Fetch a single operation by ID
      description: Returns the current state of a single operation by its UUID.
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users:
    get:
      operationId: listUsers
      tags:
        - users
      summary: List local users
      description: Returns all local Helling users. Admin role required.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListEnvelope"
              example:
                data:
                  - id: 1
                    username: admin
                    is_admin: true
                    incus_project: default
                    created_at: "2026-05-03T12:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags:
        - users
      summary: Create a local user
      description: Creates a Helling user and provisions its delegated Incus scope. Admin role required.
      requestBody:
        required: true
        description: User creation request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
            example:
              username: alice
              password: correct horse battery staple
              is_admin: false
              incus_project: alice
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
              example:
                data:
                  id: 2
                  username: alice
                  is_admin: false
                  incus_project: alice
                  created_at: "2026-05-05T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getUser
      tags:
        - users
      summary: Get a local user
      description: Returns one Helling user. Admin role required.
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
              example:
                data:
                  id: 2
                  username: alice
                  is_admin: false
                  incus_project: alice
                  created_at: "2026-05-05T09:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags:
        - users
      summary: Update a local user
      description: Partially updates mutable user fields. Admin role required.
      requestBody:
        required: true
        description: Partial user update request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
            example:
              is_admin: false
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
              example:
                data:
                  id: 2
                  username: alice
                  is_admin: false
                  incus_project: alice
                  created_at: "2026-05-05T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUser
      tags:
        - users
      summary: Delete a local user
      description: Deletes a user and revokes its delegated Incus trust entry. Admin role required.
      responses:
        "204":
          description: User deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/scope:
    parameters:
      - $ref: "#/components/parameters/UserID"
    put:
      operationId: updateUserScope
      tags:
        - users
      summary: Assign a user to an Incus project
      description: Replaces the user's Incus project scope and rotates the restricted trust entry. Admin role required.
      requestBody:
        required: true
        description: Scope assignment request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserScopeRequest"
            example:
              scope: incus:project:alice
      responses:
        "200":
          description: Scope assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserScopeEnvelope"
              example:
                data:
                  scope: incus:project:alice
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules:
    get:
      operationId: listSchedules
      tags:
        - schedules
      summary: List schedules
      description: Returns systemd timer-backed schedules tracked by Helling. Admin role required.
      parameters:
        - in: query
          name: kind
          description: Optional schedule kind filter.
          schema:
            type: string
            description: Schedule kind filter.
            enum: [backup, snapshot]
            example: backup
      responses:
        "200":
          description: Schedule list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleListEnvelope"
              example:
                data:
                  - id: 018f3a40-0000-7000-8000-000000000000
                    name: nightly-backup
                    kind: backup
                    target: vm-web-1
                    on_calendar: daily
                    enabled: true
                    unit_name: helling-schedule-018f3a40-0000-7000-8000-000000000000
                    created_at: "2026-05-05T09:00:00Z"
                    updated_at: "2026-05-05T09:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createSchedule
      tags:
        - schedules
      summary: Create a schedule
      description: Writes validated schedule units, enables the timer, persists metadata, and emits audit/event records. Admin role required.
      requestBody:
        required: true
        description: Schedule creation request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreateRequest"
            example:
              name: nightly-backup
              kind: backup
              target: vm-web-1
              on_calendar: daily
              enabled: true
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEnvelope"
              example:
                data:
                  id: 018f3a40-0000-7000-8000-000000000000
                  name: nightly-backup
                  kind: backup
                  target: vm-web-1
                  on_calendar: daily
                  enabled: true
                  unit_name: helling-schedule-018f3a40-0000-7000-8000-000000000000
                  created_at: "2026-05-05T09:00:00Z"
                  updated_at: "2026-05-05T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/UUID"
    get:
      operationId: getSchedule
      tags:
        - schedules
      summary: Get a schedule
      description: Returns one schedule. Admin role required.
      responses:
        "200":
          description: Schedule details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEnvelope"
              example:
                data:
                  id: 018f3a40-0000-7000-8000-000000000000
                  name: nightly-backup
                  kind: backup
                  target: vm-web-1
                  on_calendar: daily
                  enabled: true
                  unit_name: helling-schedule-018f3a40-0000-7000-8000-000000000000
                  created_at: "2026-05-05T09:00:00Z"
                  updated_at: "2026-05-05T09:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSchedule
      tags:
        - schedules
      summary: Update a schedule
      description: Partially updates a schedule, rewrites its units, and preserves unchanged fields. Admin role required.
      requestBody:
        required: true
        description: Partial schedule update request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdateRequest"
            example:
              on_calendar: "Mon *-*-* 03:00:00"
              enabled: true
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEnvelope"
              example:
                data:
                  id: 018f3a40-0000-7000-8000-000000000000
                  name: nightly-backup
                  kind: backup
                  target: vm-web-1
                  on_calendar: "Mon *-*-* 03:00:00"
                  enabled: true
                  unit_name: helling-schedule-018f3a40-0000-7000-8000-000000000000
                  created_at: "2026-05-05T09:00:00Z"
                  updated_at: "2026-05-05T10:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSchedule
      tags:
        - schedules
      summary: Delete a schedule
      description: Removes managed systemd units and deletes schedule metadata. Admin role required.
      responses:
        "204":
          description: Schedule deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules/{id}/run:
    parameters:
      - $ref: "#/components/parameters/UUID"
    post:
      operationId: runSchedule
      tags:
        - schedules
      summary: Run a schedule now
      description: Triggers the schedule through the Helling API and Incus proxy path. Admin role required.
      responses:
        "202":
          description: Schedule run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
              example:
                data:
                  id: 018f3a41-0000-7000-8000-000000000000
                  type: schedule.started
                  time: "2026-05-05T10:00:00Z"
                  source: helling
                  subject: 018f3a40-0000-7000-8000-000000000000
                  data: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks:
    get:
      operationId: listWebhooks
      tags:
        - webhooks
      summary: List webhooks
      description: Returns webhook definitions without secrets. Admin role required.
      responses:
        "200":
          description: Webhook list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookListEnvelope"
              example:
                data:
                  - id: 018f3a50-0000-7000-8000-000000000000
                    name: ops
                    url: https://hooks.example.com/helling
                    events:
                      - instance.started
                    enabled: true
                    created_at: "2026-05-05T09:00:00Z"
                    updated_at: "2026-05-05T09:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWebhook
      tags:
        - webhooks
      summary: Create a webhook
      description: Stores an age-encrypted HMAC secret and validates the HTTPS destination. Admin role required.
      requestBody:
        required: true
        description: Webhook creation request. Secret is write-only.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreateRequest"
            example:
              name: ops
              url: https://hooks.example.com/helling
              events:
                - instance.started
              secret: "redacted-example"
      responses:
        "201":
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEnvelope"
              example:
                data:
                  id: 018f3a50-0000-7000-8000-000000000000
                  name: ops
                  url: https://hooks.example.com/helling
                  events:
                    - instance.started
                  enabled: true
                  created_at: "2026-05-05T09:00:00Z"
                  updated_at: "2026-05-05T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/UUID"
    get:
      operationId: getWebhook
      tags:
        - webhooks
      summary: Get a webhook
      description: Returns one webhook without its secret. Admin role required.
      responses:
        "200":
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEnvelope"
              example:
                data:
                  id: 018f3a50-0000-7000-8000-000000000000
                  name: ops
                  url: https://hooks.example.com/helling
                  events:
                    - instance.started
                  enabled: true
                  created_at: "2026-05-05T09:00:00Z"
                  updated_at: "2026-05-05T09:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWebhook
      tags:
        - webhooks
      summary: Update a webhook
      description: Partially updates webhook metadata and optionally rotates the secret. Admin role required.
      requestBody:
        required: true
        description: Partial webhook update request. Secret is write-only.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookUpdateRequest"
            example:
              enabled: false
      responses:
        "200":
          description: Webhook updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEnvelope"
              example:
                data:
                  id: 018f3a50-0000-7000-8000-000000000000
                  name: ops
                  url: https://hooks.example.com/helling
                  events:
                    - instance.started
                  enabled: false
                  created_at: "2026-05-05T09:00:00Z"
                  updated_at: "2026-05-05T10:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWebhook
      tags:
        - webhooks
      summary: Delete a webhook
      description: Deletes a webhook and delivery history. Admin role required.
      responses:
        "204":
          description: Webhook deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/{id}/test:
    parameters:
      - $ref: "#/components/parameters/UUID"
    post:
      operationId: testWebhook
      tags:
        - webhooks
      summary: Send a webhook test event
      description: Sends a signed test event and records delivery attempts. Admin role required.
      responses:
        "202":
          description: Webhook test queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryEnvelope"
              example:
                data:
                  id: 018f3a51-0000-7000-8000-000000000000
                  webhook_id: 018f3a50-0000-7000-8000-000000000000
                  event_id: 018f3a52-0000-7000-8000-000000000000
                  event_type: webhook.test
                  status: pending
                  attempt: 1
                  created_at: "2026-05-05T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /firewall/host:
    get:
      operationId: listHostFirewallRules
      tags:
        - firewall
      summary: List host firewall rules
      description: Returns Helling-managed nftables host firewall rules. Admin role required.
      responses:
        "200":
          description: Host firewall rule list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallRuleListEnvelope"
              example:
                data:
                  - id: 018f3a60-0000-7000-8000-000000000000
                    direction: input
                    action: accept
                    protocol: tcp
                    source_cidr: 203.0.113.10/32
                    destination_port: 22
                    enabled: true
                    comment: ssh from admin
                    nft_comment: helling:018f3a60-0000-7000-8000-000000000000
                    created_at: "2026-05-05T09:00:00Z"
                    updated_at: "2026-05-05T09:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createHostFirewallRule
      tags:
        - firewall
      summary: Create a host firewall rule
      description: Persists metadata and applies an nft rule using structured argv. Admin role required.
      requestBody:
        required: true
        description: Host firewall rule creation request.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirewallRuleCreateRequest"
            example:
              direction: input
              action: accept
              protocol: tcp
              source_cidr: 203.0.113.10/32
              destination_port: 22
              enabled: true
              comment: ssh from admin
      responses:
        "201":
          description: Host firewall rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallRuleEnvelope"
              example:
                data:
                  id: 018f3a60-0000-7000-8000-000000000000
                  direction: input
                  action: accept
                  protocol: tcp
                  source_cidr: 203.0.113.10/32
                  destination_port: 22
                  enabled: true
                  comment: ssh from admin
                  nft_comment: helling:018f3a60-0000-7000-8000-000000000000
                  created_at: "2026-05-05T09:00:00Z"
                  updated_at: "2026-05-05T09:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /firewall/host/{id}:
    parameters:
      - $ref: "#/components/parameters/UUID"
    delete:
      operationId: deleteHostFirewallRule
      tags:
        - firewall
      summary: Delete a host firewall rule
      description: Deletes a Helling-managed nftables rule by metadata id. Admin role required.
      responses:
        "204":
          description: Host firewall rule deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /events:
    get:
      operationId: listEvents
      tags:
        - events
      summary: Stream or list events
      description: |
        Streams Server-Sent Events when requested with
        `Accept: text/event-stream`; otherwise returns a JSON snapshot for CLI
        and dashboard hydration.
      parameters:
        - in: query
          name: limit
          description: Maximum number of recent events for JSON snapshot mode.
          schema:
            type: integer
            description: Maximum number of recent events.
            minimum: 1
            maximum: 500
            default: 50
            example: 50
        - in: query
          name: type
          description: Optional exact or prefix event type filter.
          schema:
            type: string
            description: Event type or prefix.
            example: instance.
        - in: query
          name: since
          description: Event id lower bound for replay.
          schema:
            type: string
            description: Event id lower bound.
            example: 018f3a40-0000-7000-8000-000000000000
      responses:
        "200":
          description: Event stream or JSON snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListEnvelope"
              example:
                data:
                  - id: 018f3a41-0000-7000-8000-000000000000
                    type: instance.started
                    time: "2026-05-05T10:00:00Z"
                    source: incus
                    subject: vm-web-1
                    data: {}
            text/event-stream:
              schema:
                type: string
                description: SSE frames containing Helling event JSON payloads.
              example: "event: instance.started\nid: 018f3a41-0000-7000-8000-000000000000\ndata: {\"type\":\"instance.started\"}\n\n"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audit:
    get:
      operationId: listAuditEvents
      tags:
        - audit
      summary: Query audit events
      description: Reads bounded Helling audit entries from journald. Admin role required.
      parameters:
        - in: query
          name: actor
          description: Optional actor username filter.
          schema:
            type: string
            description: Actor username filter.
            example: admin
        - in: query
          name: action
          description: Optional action filter.
          schema:
            type: string
            description: Helling audit action.
            example: schedule.create
        - in: query
          name: outcome
          description: Optional outcome filter.
          schema:
            type: string
            description: Audit outcome filter.
            enum: [success, failure, denied]
            example: success
        - in: query
          name: since
          description: Optional RFC 3339 lower time bound.
          schema:
            type: string
            description: Lower time bound.
            format: date-time
            example: "2026-05-05T00:00:00Z"
        - in: query
          name: until
          description: Optional RFC 3339 upper time bound.
          schema:
            type: string
            description: Upper time bound.
            format: date-time
            example: "2026-05-06T00:00:00Z"
        - in: query
          name: limit
          description: Maximum number of audit entries to return.
          schema:
            type: integer
            description: Maximum audit result count.
            minimum: 1
            maximum: 500
            default: 100
            example: 100
      responses:
        "200":
          description: Audit event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListEnvelope"
              example:
                data:
                  - id: 018f3a70-0000-7000-8000-000000000000
                    time: "2026-05-05T10:00:00Z"
                    actor: admin
                    action: schedule.create
                    outcome: success
                    target_type: schedule
                    target_id: 018f3a40-0000-7000-8000-000000000000
                    message: schedule created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /audit/export:
    get:
      operationId: exportAuditEvents
      tags:
        - audit
      summary: Export audit events
      description: Streams bounded journald audit records as JSON Lines. Admin role required.
      parameters:
        - in: query
          name: actor
          description: Optional actor username filter.
          schema:
            type: string
            description: Actor username filter.
            example: admin
        - in: query
          name: action
          description: Optional action filter.
          schema:
            type: string
            description: Helling audit action.
            example: schedule.create
        - in: query
          name: outcome
          description: Optional outcome filter.
          schema:
            type: string
            description: Audit outcome filter.
            enum: [success, failure, denied]
            example: success
        - in: query
          name: limit
          description: Maximum number of audit lines to stream.
          schema:
            type: integer
            description: Maximum audit export count.
            minimum: 1
            maximum: 5000
            default: 500
            example: 500
      responses:
        "200":
          description: Audit JSON Lines stream
          content:
            application/x-ndjson:
              schema:
                type: string
                description: JSON Lines audit export.
              example: "{\"action\":\"schedule.create\",\"outcome\":\"success\"}\n"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: helling_session
      description: Session cookie issued by `POST /auth/login`. Sent automatically by the browser; CLI stores it under `~/.config/helling/session`.

  parameters:
    InstanceName:
      in: path
      name: name
      required: true
      description: Instance name path parameter.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        example: web-1
        description: |
          Instance name. Lowercase letters, digits, and hyphens only.
          Max 63 chars. Must start with letter or digit.
    UUID:
      in: path
      name: id
      required: true
      description: UUID path parameter.
      schema:
        type: string
        description: UUID v7 string.
        format: uuid
        example: 018f3a40-0000-7000-8000-000000000000
    UserID:
      in: path
      name: id
      required: true
      description: Local user id path parameter.
      schema:
        type: integer
        description: Stable local user id.
        format: int64
        minimum: 1
        example: 2

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated principal lacks the required role or token scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State conflict (e.g. instance already exists, already running)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Required local service or setup material is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      description: Daemon liveness payload.
      required: [status]
      properties:
        status:
          type: string
          description: Aggregate daemon health state.
          enum: [ok, degraded]
          example: ok
        incus_reachable:
          type: boolean
          description: True when the Incus socket responded to the last probe.
          example: true

    Version:
      type: object
      description: Server build metadata.
      required: [version, api_version]
      properties:
        version:
          type: string
          description: Daemon semantic version string.
          example: 0.1.0
        api_version:
          type: string
          description: REST API major-version path segment.
          example: v1
        commit:
          type: string
          description: Git commit short SHA the binary was built from.
          example: 30ab4f5
        build_time:
          type: string
          description: Build timestamp (RFC 3339 / ISO 8601).
          format: date-time
          example: "2026-05-03T12:00:00Z"

    LoginRequest:
      type: object
      description: Username + password credentials submitted to `/auth/login`.
      required: [username, password]
      properties:
        username:
          type: string
          description: Account username.
          minLength: 1
          maxLength: 64
          example: alice
        password:
          type: string
          description: Account password (cleartext over TLS only).
          minLength: 8
          maxLength: 256
          format: password
          example: correct horse battery staple

    SetupRequest:
      type: object
      description: First-admin credentials plus the installer setup token.
      required: [username, password, setup_token]
      properties:
        username:
          type: string
          description: Initial admin username.
          minLength: 1
          maxLength: 64
          example: admin
        password:
          type: string
          description: Initial admin password.
          minLength: 8
          maxLength: 256
          format: password
          example: correct horse battery staple
        setup_token:
          type: string
          description: One-time setup token read from `/etc/helling/setup-token`.
          minLength: 32
          maxLength: 128
          format: password
          example: NlJfR2S7aG9uTSaKlJ5gMlR8n8dujAErDXsQu7ulFE4=

    SetupStatus:
      type: object
      description: First-admin setup availability.
      required: [setup_required]
      properties:
        setup_required:
          type: boolean
          description: True while no users exist and `/auth/setup` can create the first admin.
          example: true

    MFACompleteRequest:
      type: object
      description: TOTP or recovery-code proof for a pre-session MFA challenge.
      required: [mfa_token]
      properties:
        mfa_token:
          type: string
          description: Opaque pre-session challenge token returned by `/auth/login`.
          minLength: 16
          maxLength: 256
          example: c08f4a7281b54d9abef67c210d3e49a2
        totp_code:
          type: string
          description: Six-digit TOTP code from the user's authenticator app.
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
          example: "123456"
        recovery_code:
          type: string
          description: One-time recovery code shown during TOTP enrollment.
          minLength: 16
          maxLength: 64
          example: ABCD-EFGH-IJKL-MNOP

    AuthTokenEnvelope:
      type: object
      description: JSON envelope returned by auth flows that issue or continue a session.
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AuthTokenResponse"

    AuthTokenResponse:
      type: object
      description: Auth response data for password and MFA flows.
      required: [mfa_required]
      properties:
        access_token:
          type: string
          description: Ed25519-signed JWT access token. Present when MFA is not required or after MFA completion.
          example: eyJhbGciOiJFZERTQSJ9...
        token_type:
          type: string
          description: Bearer token type for the access token.
          enum: [Bearer]
          example: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          minimum: 1
          example: 900
        mfa_required:
          type: boolean
          description: True when the password was accepted but TOTP or a recovery code is still required.
          example: false
        mfa_token:
          type: string
          description: Opaque pre-session MFA token. Present only when `mfa_required` is true.
          example: c08f4a7281b54d9abef67c210d3e49a2

    User:
      type: object
      description: Authenticated user identity.
      required: [id, username, is_admin, created_at]
      properties:
        id:
          type: integer
          description: Stable user identifier.
          format: int64
          example: 1
        username:
          type: string
          description: Account username.
          example: alice
        is_admin:
          type: boolean
          description: True for the bootstrap admin user.
          example: false
        incus_project:
          type: string
          description: Incus project assigned to this user for delegated proxy calls.
          example: alice
        created_at:
          type: string
          description: Account creation time (RFC 3339).
          format: date-time
          example: "2026-05-03T12:00:00Z"

    Instance:
      type: object
      description: Container or virtual-machine instance snapshot.
      required: [name, type, status]
      properties:
        name:
          type: string
          description: Instance name (Incus identifier).
          example: web-1
        type:
          type: string
          description: Instance kind reported by Incus.
          enum: [container, virtual-machine]
          example: container
        status:
          type: string
          description: Current lifecycle state.
          enum: [running, stopped, frozen, error, starting, stopping]
          example: running
        image:
          type: string
          description: Source image alias or fingerprint.
          example: images:debian/13
        architecture:
          type: string
          description: CPU architecture.
          example: x86_64
        created_at:
          type: string
          description: Instance creation timestamp (RFC 3339).
          format: date-time
          example: "2026-05-03T12:00:00Z"
        ipv4:
          type: array
          description: IPv4 addresses assigned to the instance.
          example: ["10.0.0.5"]
          items:
            type: string
            description: IPv4 address in dotted-quad form.
            example: 10.0.0.5
        ipv6:
          type: array
          description: IPv6 addresses assigned to the instance.
          example: ["fd42::5"]
          items:
            type: string
            description: IPv6 address.
            example: fd42::5

    InstanceCreate:
      type: object
      description: Request body for `POST /instances`.
      required: [name, image]
      properties:
        name:
          type: string
          description: Desired instance name.
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
          example: web-1
        type:
          type: string
          description: Instance kind to create.
          enum: [container, virtual-machine]
          default: container
          example: container
        image:
          type: string
          description: |
            Image alias or fingerprint. Examples: `images:debian/13`,
            `images:ubuntu/24.04`, or a sha256 fingerprint.
          example: images:debian/13
        start:
          type: boolean
          description: If true, start immediately after creation.
          default: false
          example: false

    InstanceStopRequest:
      type: object
      description: Optional body for `POST /instances/{name}/stop`.
      properties:
        force:
          type: boolean
          description: If true, send SIGKILL after timeout instead of SIGTERM grace.
          default: false
          example: false
        timeout_seconds:
          type: integer
          description: Seconds to wait for graceful shutdown before forcing.
          minimum: 0
          maximum: 600
          default: 30
          example: 30

    Operation:
      type: object
      description: Async operation tracking record.
      required: [id, kind, status, created_at, updated_at]
      properties:
        id:
          type: string
          description: Operation identifier (UUID v7).
          format: uuid
          example: 018f3a40-0000-7000-8000-000000000000
        kind:
          type: string
          description: Operation kind, e.g. `instance.create` or `instance.delete`.
          example: instance.create
        target:
          type: string
          description: Resource the operation acts on (e.g. instance name).
          example: web-1
        status:
          type: string
          description: Current operation lifecycle state.
          enum: [pending, running, success, failure, cancelled]
          example: running
        error:
          type: string
          description: Present when status is `failure`.
          example: image fetch failed
        created_at:
          type: string
          description: Operation submission time (RFC 3339).
          format: date-time
          example: "2026-05-03T12:00:00Z"
        updated_at:
          type: string
          description: Last state-change time (RFC 3339).
          format: date-time
          example: "2026-05-03T12:00:05Z"
        progress_percent:
          type: integer
          description: Approximate progress between 0 and 100 (best-effort).
          minimum: 0
          maximum: 100
          example: 42

    UserEnvelope:
      type: object
      description: Envelope containing one user.
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"

    UserListEnvelope:
      type: object
      description: Envelope containing users.
      required: [data]
      properties:
        data:
          type: array
          description: User payload list.
          example:
            - id: 1
              username: admin
              is_admin: true
              incus_project: default
              created_at: "2026-05-03T12:00:00Z"
          items:
            $ref: "#/components/schemas/User"

    UserCreateRequest:
      type: object
      description: Request body for creating a local user.
      required: [username, password]
      properties:
        username:
          type: string
          description: Account username.
          minLength: 1
          maxLength: 32
          example: alice
        password:
          type: string
          description: Initial account password.
          minLength: 8
          maxLength: 1024
          format: password
          writeOnly: true
          example: correct horse battery staple
        is_admin:
          type: boolean
          description: True when the created user should receive admin role.
          default: false
          example: false
        incus_project:
          type: string
          description: Incus project assigned to the user's restricted certificate.
          minLength: 1
          maxLength: 63
          example: alice

    UserUpdateRequest:
      type: object
      description: Partial request body for updating a local user.
      properties:
        password:
          type: string
          description: Replacement account password.
          minLength: 8
          maxLength: 1024
          format: password
          writeOnly: true
          example: correct horse battery staple
        is_admin:
          type: boolean
          description: Replacement admin-role flag.
          example: false

    UserScopeRequest:
      type: object
      description: Request body for assigning a delegated Incus project scope.
      required: [scope]
      properties:
        scope:
          type: string
          description: Incus scope label in `incus:project:<name>` form.
          minLength: 1
          maxLength: 128
          example: incus:project:alice

    UserScopeEnvelope:
      type: object
      description: Envelope containing the assigned user scope.
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserScope"

    UserScope:
      type: object
      description: Delegated Incus scope assigned to a user.
      required: [scope]
      properties:
        scope:
          type: string
          description: Incus scope label in `incus:project:<name>` form.
          example: incus:project:alice

    Schedule:
      type: object
      description: systemd timer-backed Helling schedule.
      required: [id, name, kind, target, on_calendar, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          description: Schedule UUID.
          format: uuid
          example: 018f3a40-0000-7000-8000-000000000000
        name:
          type: string
          description: Human label for the schedule.
          minLength: 1
          maxLength: 63
          example: nightly-backup
        kind:
          type: string
          description: Scheduled operation kind.
          enum: [backup, snapshot]
          example: backup
        target:
          type: string
          description: Target instance, project, or Helling selector for the schedule.
          minLength: 1
          maxLength: 128
          example: vm-web-1
        on_calendar:
          type: string
          description: systemd OnCalendar expression.
          minLength: 1
          maxLength: 256
          example: daily
        enabled:
          type: boolean
          description: True when the timer should be enabled.
          example: true
        unit_name:
          type: string
          description: Base unit name without extension.
          example: helling-schedule-018f3a40-0000-7000-8000-000000000000
        last_run_at:
          type: string
          description: Last observed run timestamp.
          format: date-time
          nullable: true
          example: "2026-05-05T10:00:00Z"
        next_run_at:
          type: string
          description: Next scheduled run timestamp when known.
          format: date-time
          nullable: true
          example: "2026-05-06T00:00:00Z"
        last_status:
          type: string
          description: Last run status.
          enum: [success, failed, skipped, never]
          example: never
        last_error:
          type: string
          description: Last run error summary.
          nullable: true
          example: backup failed
        created_at:
          type: string
          description: Schedule creation time.
          format: date-time
          example: "2026-05-05T09:00:00Z"
        updated_at:
          type: string
          description: Schedule update time.
          format: date-time
          example: "2026-05-05T09:00:00Z"

    ScheduleCreateRequest:
      type: object
      description: Request body for creating a schedule.
      required: [name, kind, target, on_calendar]
      properties:
        name:
          type: string
          description: Human label for the schedule.
          minLength: 1
          maxLength: 63
          example: nightly-backup
        kind:
          type: string
          description: Scheduled operation kind.
          enum: [backup, snapshot]
          example: backup
        target:
          type: string
          description: Target instance, project, or Helling selector for the schedule.
          minLength: 1
          maxLength: 128
          example: vm-web-1
        on_calendar:
          type: string
          description: systemd OnCalendar expression.
          minLength: 1
          maxLength: 256
          example: daily
        enabled:
          type: boolean
          description: Initial timer enabled state.
          default: true
          example: true

    ScheduleUpdateRequest:
      type: object
      description: Partial request body for updating a schedule.
      properties:
        name:
          type: string
          description: Replacement human label.
          minLength: 1
          maxLength: 63
          example: nightly-backup
        on_calendar:
          type: string
          description: Replacement systemd OnCalendar expression.
          minLength: 1
          maxLength: 256
          example: "Mon *-*-* 03:00:00"
        enabled:
          type: boolean
          description: Replacement enabled state.
          example: true

    ScheduleEnvelope:
      type: object
      description: Envelope containing one schedule.
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Schedule"

    ScheduleListEnvelope:
      type: object
      description: Envelope containing schedules.
      required: [data]
      properties:
        data:
          type: array
          description: Schedule payload list.
          example:
            - id: 018f3a40-0000-7000-8000-000000000000
              name: nightly-backup
              kind: backup
              target: vm-web-1
              on_calendar: daily
              enabled: true
              created_at: "2026-05-05T09:00:00Z"
              updated_at: "2026-05-05T09:00:00Z"
          items:
            $ref: "#/components/schemas/Schedule"

    Webhook:
      type: object
      description: Outbound webhook definition without secret material.
      required: [id, name, url, events, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          description: Webhook UUID.
          format: uuid
          example: 018f3a50-0000-7000-8000-000000000000
        name:
          type: string
          description: Human label for the webhook.
          minLength: 1
          maxLength: 63
          example: ops
        url:
          type: string
          description: HTTPS webhook destination.
          format: uri
          example: https://hooks.example.com/helling
        events:
          type: array
          description: Event types delivered to this webhook.
          items:
            type: string
            description: Helling event type.
            example: instance.started
        enabled:
          type: boolean
          description: True when delivery is enabled.
          example: true
        created_at:
          type: string
          description: Webhook creation time.
          format: date-time
          example: "2026-05-05T09:00:00Z"
        updated_at:
          type: string
          description: Webhook update time.
          format: date-time
          example: "2026-05-05T09:00:00Z"

    WebhookCreateRequest:
      type: object
      description: Request body for creating a webhook.
      required: [name, url, events, secret]
      properties:
        name:
          type: string
          description: Human label for the webhook.
          minLength: 1
          maxLength: 63
          example: ops
        url:
          type: string
          description: HTTPS webhook destination.
          format: uri
          example: https://hooks.example.com/helling
        events:
          type: array
          description: Event types delivered to this webhook.
          minItems: 1
          example: [instance.started]
          items:
            type: string
            description: Helling event type.
            example: instance.started
        secret:
          type: string
          description: HMAC secret. Stored encrypted and never returned.
          minLength: 16
          maxLength: 512
          format: password
          writeOnly: true
          example: redacted-example
        enabled:
          type: boolean
          description: Initial delivery enabled state.
          default: true
          example: true

    WebhookUpdateRequest:
      type: object
      description: Partial request body for updating a webhook.
      properties:
        name:
          type: string
          description: Replacement human label.
          minLength: 1
          maxLength: 63
          example: ops
        url:
          type: string
          description: Replacement HTTPS webhook destination.
          format: uri
          example: https://hooks.example.com/helling
        events:
          type: array
          description: Replacement event type list.
          example: [instance.started]
          items:
            type: string
            description: Helling event type.
            example: instance.started
        secret:
          type: string
          description: Replacement HMAC secret. Stored encrypted and never returned.
          minLength: 16
          maxLength: 512
          format: password
          writeOnly: true
          example: redacted-example
        enabled:
          type: boolean
          description: Replacement delivery enabled state.
          example: true

    WebhookEnvelope:
      type: object
      description: Envelope containing one webhook.
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Webhook"

    WebhookListEnvelope:
      type: object
      description: Envelope containing webhooks.
      required: [data]
      properties:
        data:
          type: array
          description: Webhook payload list.
          example:
            - id: 018f3a50-0000-7000-8000-000000000000
              name: ops
              url: https://hooks.example.com/helling
              events:
                - instance.started
              enabled: true
              created_at: "2026-05-05T09:00:00Z"
              updated_at: "2026-05-05T09:00:00Z"
          items:
            $ref: "#/components/schemas/Webhook"

    WebhookDelivery:
      type: object
      description: Webhook delivery attempt record.
      required: [id, webhook_id, event_id, event_type, status, attempt, created_at]
      properties:
        id:
          type: string
          description: Delivery UUID.
          format: uuid
          example: 018f3a51-0000-7000-8000-000000000000
        webhook_id:
          type: string
          description: Webhook UUID.
          format: uuid
          example: 018f3a50-0000-7000-8000-000000000000
        event_id:
          type: string
          description: Event UUID.
          format: uuid
          example: 018f3a52-0000-7000-8000-000000000000
        event_type:
          type: string
          description: Helling event type.
          example: webhook.test
        status:
          type: string
          description: Delivery status.
          enum: [pending, success, failed]
          example: pending
        attempt:
          type: integer
          description: Attempt number starting at 1.
          minimum: 1
          example: 1
        http_status:
          type: integer
          description: HTTP response status when available.
          nullable: true
          example: 200
        error:
          type: string
          description: Delivery error summary.
          nullable: true
          example: request timed out
        created_at:
          type: string
          description: Delivery creation time.
          format: date-time
          example: "2026-05-05T10:00:00Z"

    WebhookDeliveryEnvelope:
      type: object
      description: Envelope containing one webhook delivery.
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/WebhookDelivery"

    FirewallRule:
      type: object
      description: Helling-managed host firewall rule.
      required: [id, direction, action, protocol, enabled, nft_comment, created_at, updated_at]
      properties:
        id:
          type: string
          description: Firewall rule UUID.
          format: uuid
          example: 018f3a60-0000-7000-8000-000000000000
        direction:
          type: string
          description: nftables base chain direction.
          enum: [input, output, forward]
          example: input
        action:
          type: string
          description: Firewall verdict.
          enum: [accept, drop, reject]
          example: accept
        protocol:
          type: string
          description: Layer-4 protocol.
          enum: [tcp, udp, icmp, any]
          example: tcp
        source_cidr:
          type: string
          description: Optional source CIDR.
          nullable: true
          example: 203.0.113.10/32
        destination_cidr:
          type: string
          description: Optional destination CIDR.
          nullable: true
          example: 10.0.0.5/32
        destination_port:
          type: integer
          description: Optional destination port.
          minimum: 1
          maximum: 65535
          nullable: true
          example: 22
        enabled:
          type: boolean
          description: True when the rule is active.
          example: true
        comment:
          type: string
          description: Operator-facing comment.
          nullable: true
          example: ssh from admin
        nft_comment:
          type: string
          description: nftables comment used to identify Helling-managed rules.
          example: helling:018f3a60-0000-7000-8000-000000000000
        nft_handle:
          type: integer
          description: nftables handle when known.
          nullable: true
          example: 42
        created_at:
          type: string
          description: Rule creation time.
          format: date-time
          example: "2026-05-05T09:00:00Z"
        updated_at:
          type: string
          description: Rule update time.
          format: date-time
          example: "2026-05-05T09:00:00Z"

    FirewallRuleCreateRequest:
      type: object
      description: Request body for creating a host firewall rule.
      required: [direction, action, protocol]
      properties:
        direction:
          type: string
          description: nftables base chain direction.
          enum: [input, output, forward]
          example: input
        action:
          type: string
          description: Firewall verdict.
          enum: [accept, drop, reject]
          example: accept
        protocol:
          type: string
          description: Layer-4 protocol.
          enum: [tcp, udp, icmp, any]
          example: tcp
        source_cidr:
          type: string
          description: Optional source CIDR.
          example: 203.0.113.10/32
        destination_cidr:
          type: string
          description: Optional destination CIDR.
          example: 10.0.0.5/32
        destination_port:
          type: integer
          description: Optional destination port.
          minimum: 1
          maximum: 65535
          example: 22
        enabled:
          type: boolean
          description: Initial active state.
          default: true
          example: true
        comment:
          type: string
          description: Operator-facing comment.
          maxLength: 256
          example: ssh from admin

    FirewallRuleEnvelope:
      type: object
      description: Envelope containing one host firewall rule.
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FirewallRule"

    FirewallRuleListEnvelope:
      type: object
      description: Envelope containing host firewall rules.
      required: [data]
      properties:
        data:
          type: array
          description: Host firewall rule payload list.
          example:
            - id: 018f3a60-0000-7000-8000-000000000000
              direction: input
              action: accept
              protocol: tcp
              source_cidr: 203.0.113.10/32
              destination_port: 22
              enabled: true
              nft_comment: helling:018f3a60-0000-7000-8000-000000000000
              created_at: "2026-05-05T09:00:00Z"
              updated_at: "2026-05-05T09:00:00Z"
          items:
            $ref: "#/components/schemas/FirewallRule"

    Event:
      type: object
      description: Helling event payload shared by SSE and webhooks.
      required: [id, type, time, source, subject, data]
      properties:
        id:
          type: string
          description: Event UUID.
          format: uuid
          example: 018f3a41-0000-7000-8000-000000000000
        type:
          type: string
          description: Helling event type.
          example: instance.started
        time:
          type: string
          description: Event timestamp.
          format: date-time
          example: "2026-05-05T10:00:00Z"
        source:
          type: string
          description: Source subsystem.
          enum: [incus, podman, helling]
          example: incus
        subject:
          type: string
          description: Resource affected by the event.
          example: vm-web-1
        data:
          type: object
          description: Event-specific metadata.
          additionalProperties: true
          example: {}

    EventEnvelope:
      type: object
      description: Envelope containing one event.
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Event"

    EventListEnvelope:
      type: object
      description: Envelope containing events.
      required: [data]
      properties:
        data:
          type: array
          description: Event payload list.
          example:
            - id: 018f3a41-0000-7000-8000-000000000000
              type: instance.started
              time: "2026-05-05T10:00:00Z"
              source: incus
              subject: vm-web-1
              data: {}
          items:
            $ref: "#/components/schemas/Event"

    AuditEvent:
      type: object
      description: Journal-backed Helling audit event.
      required: [time, action, outcome, message]
      properties:
        id:
          type: string
          description: Event id derived from journal cursor or generated fallback.
          example: 018f3a70-0000-7000-8000-000000000000
        time:
          type: string
          description: Audit timestamp.
          format: date-time
          example: "2026-05-05T10:00:00Z"
        actor:
          type: string
          description: Actor username when known.
          example: admin
        action:
          type: string
          description: Helling audit action.
          example: schedule.create
        outcome:
          type: string
          description: Audit outcome.
          enum: [success, failure, denied]
          example: success
        target_type:
          type: string
          description: Target resource type.
          example: schedule
        target_id:
          type: string
          description: Target resource identifier.
          example: 018f3a40-0000-7000-8000-000000000000
        message:
          type: string
          description: Human-readable audit summary.
          example: schedule created
        metadata:
          type: object
          description: Additional journal fields after redaction.
          additionalProperties: true
          example: {}

    AuditEventListEnvelope:
      type: object
      description: Envelope containing audit events.
      required: [data]
      properties:
        data:
          type: array
          description: Audit event payload list.
          example:
            - id: 018f3a70-0000-7000-8000-000000000000
              time: "2026-05-05T10:00:00Z"
              actor: admin
              action: schedule.create
              outcome: success
              target_type: schedule
              target_id: 018f3a40-0000-7000-8000-000000000000
              message: schedule created
          items:
            $ref: "#/components/schemas/AuditEvent"

    Error:
      type: object
      description: Standard error envelope returned by 4xx and 5xx responses.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          example: not_found
        message:
          type: string
          description: Human-readable message.
          example: instance not found
        details:
          type: object
          description: Optional structured context.
          additionalProperties: true
          example:
            field: name
